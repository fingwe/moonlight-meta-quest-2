name: Build Quest-Fixed Moonlight
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleNonRootDebug

      - name: Sign APK (Direct Path Fix)
        run: |
          # Locate the APK first
          APK_PATH=$(find app/build/outputs/apk -name "*debug.apk" | head -n 1)
          
          # Use the absolute path to apksigner in the GitHub runner
          # We use build-tools version 34.0.0 which is standard on ubuntu-latest
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks $ANDROID_HOME/build-tools/34.0.0/debug.keystore --ks-pass pass:android --key-pass pass:android --out app-signed.apk "$APK_PATH"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Quest-Fixed
          path: app-signed.apk