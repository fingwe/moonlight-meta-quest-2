name: Build Quest-Fixed Moonlight
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # This task automatically signs the APK with the default debug keystore
        run: ./gradlew assembleNonRootDebug

      - name: Prepare APK for Upload
        run: |
          # Find the APK generated by Gradle
          APK_PATH=$(find app/build/outputs/apk -name "*debug.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          # Rename/Move it to the expected path for the upload step
          mv "$APK_PATH" app-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Quest-Fixed
          path: app-signed.apk